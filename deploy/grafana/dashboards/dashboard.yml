# Grafana Dashboard 自动加载配置
# 将 JSON dashboard 文件放入此目录，Grafana 启动时自动导入。
apiVersion: 1

providers:
  - name: 'Gaia Dashboards'
    orgId: 1
    folder: 'Gaia'
    folderUid: 'gaia'
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards
