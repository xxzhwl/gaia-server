# Gaia 指标采集配置
# Prometheus 通过拉取 gaia-server 的 /metrics 端点采集 OTel 指标。
#
# 启动后访问:
#   - Prometheus UI: http://localhost:9090
#   - 指标检查:     http://localhost:9100/metrics
global:
  scrape_interval:     15s
  evaluation_interval: 15s

scrape_configs:
  # gaia-server OTel Prometheus 指标
  # 本地开发模式：gaia-server 运行在宿主机，Docker 通过 host.docker.internal 访问
  - job_name: 'gaia-server'
    static_configs:
      - targets: ['host.docker.internal:9100']
        labels:
          app: gaia-server
          env: development

  # gaia-server (Docker 部署模式 — 全部在 Docker 中运行时取消下方注释，注释上方)
  #- job_name: 'gaia-server'
  #  static_configs:
  #    - targets: ['gaia-server:9100']
  #      labels:
  #        app: gaia-server
  #        env: development

  # Prometheus 自身指标
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
