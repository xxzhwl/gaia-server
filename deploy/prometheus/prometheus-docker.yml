global:
  scrape_interval:     15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'gaia-server'
    static_configs:
      - targets: ['gaia-server:9100']
        labels:
          app: gaia-server
          env: development

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
